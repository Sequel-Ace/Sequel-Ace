<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
	<title>{{title}}</title>
	<!-- The Claude palette as CSS variables (surface, text, accent, …) and the light paper colours for printing. -->
	<style type="text/css" media="all" id="sa-palette">{{palette}}</style>
	<style type="text/css" media="all">
		body {
			margin: 0;
			padding: 12px 16px 16px;
			font-family: -apple-system, system-ui, sans-serif;
			font-size: 13px;
			line-height: 1.5;
			background-color: var(--sa-surface);
			color: var(--sa-text);
		}

		::selection {
			background-color: var(--sa-selection);
		}

		h1, h2, h3, .header {
			color: var(--sa-text);
			font-weight: 600;
			line-height: 1.3;
		}

		.header {
			font-size: 17px;
			margin: 2px 0 10px;
		}

		a, .internallink {
			color: var(--sa-accent);
			text-decoration: none;
		}

		a:hover, .internallink:hover {
			text-decoration: underline;
		}

		ul {
			margin: 6px 0;
			padding-left: 20px;
		}

		/* MySQL's syntax text: monospaced so its lines stay aligned, wrapped, with no box behind it. */
		.description {
			font-family: ui-monospace, 'SF Mono', Menlo, monospace;
			font-size: 12px;
			line-height: 1.5;
			white-space: pre-wrap;
			overflow-wrap: break-word;
			margin: 0 0 12px;
		}

		/* Examples sit on the code surface and scroll sideways instead of widening the page. */
		.example {
			font-family: ui-monospace, 'SF Mono', Menlo, monospace;
			font-size: 12px;
			line-height: 1.5;
			white-space: pre;
			overflow-x: auto;
			background-color: var(--sa-code);
			border-radius: 8px;
			padding: 10px 12px;
			margin: 6px 0 12px;
		}

		.nothing {
			color: var(--sa-muted);
		}

		.error {
			color: var(--sa-destructive);
			font-family: ui-monospace, 'SF Mono', Menlo, monospace;
			font-size: 12px;
		}
	</style>
	<script type="text/javascript">
		// Called on theme, accent and appearance changes with 'dark' or 'light' and the palette's variables
		// ({"--sa-accent": "#…", …}). They are set on the palette's :root rule rather than on the root element, so
		// the print rule after it still wins on paper.
		window.onThemeChange = function(theme, palette) {
			document.body.className = (theme === 'dark') ? 'dark' : '';
			if (!palette) return;
			var sheet = document.getElementById('sa-palette').sheet;
			var root = null;
			for (var i = 0; i < sheet.cssRules.length; i++) {
				if (sheet.cssRules[i].selectorText === ':root') { root = sheet.cssRules[i]; break; }
			}
			if (!root) {
				sheet.insertRule(':root {}', 0);
				root = sheet.cssRules[0];
			}
			for (var key in palette) {
				root.style.setProperty(key, palette[key]);
			}
			root.style.setProperty('color-scheme', (theme === 'dark') ? 'dark' : 'light');
		};
	</script>
</head>
<body class="{{bodyClass}}">
{{body}}
</body>
</html>
