name: PR Tests

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    # This is a GitHub-hosted public-repository runner label. Do not route OSS CI
    # through a private runner group or a self-hosted label.
    runs-on: macos-26
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Build and run tests
      run: ./Scripts/build.sh tests
      env:
        DEVELOPER_DIR: '/Applications/Xcode_26.6.app/Contents/Developer'
        TEST_ARCH: arm64

  release_tools:
    name: Release Tool Tests
    # Keep release-infrastructure CI on GitHub-hosted macOS as well.
    runs-on: macos-15
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Ruby and locked gems
      uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Run release infrastructure tests
      run: bundle exec rake -f fastlane/Rakefile test
