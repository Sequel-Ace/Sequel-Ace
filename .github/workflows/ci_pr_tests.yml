name: PR Tests

on: pull_request

permissions:
  contents: read

jobs:
  tests:
    name: Run Tests
    # This is a GitHub-hosted public-repository runner label. Do not route OSS CI
    # through a private runner group or a self-hosted label.
    runs-on: macos-26
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Build and run tests
      run: ./Scripts/build.sh tests
      env:
        DEVELOPER_DIR: '/Applications/Xcode_26.6.app/Contents/Developer'
        TEST_ARCH: arm64

  framework_tests:
    name: SPMySQL Framework Tests
    runs-on: macos-latest
    timeout-minutes: 30
    env:
      HOMEBREW_NO_AUTO_UPDATE: '1'
      SPMYSQL_TEST_MYSQL_FORMULA: mysql@8.4
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Test the live-coverage result check
      run: xcrun swift Scripts/verify-spmysql-results.swift --self-test
    - name: Install MySQL 8.4 LTS for the disposable test server
      run: brew list --versions "$SPMYSQL_TEST_MYSQL_FORMULA" || brew install "$SPMYSQL_TEST_MYSQL_FORMULA"
    - name: Build and run framework tests with a disposable database
      run: bash Scripts/test-spmysql-framework.sh
    - name: Upload framework results and database logs
      if: always()
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: spmysql-framework-results
        path: build/spmysql-ci/
        if-no-files-found: warn
        retention-days: 7

  release_tools:
    name: Release Tool Tests
    # Keep release-infrastructure CI on GitHub-hosted macOS as well.
    runs-on: macos-15
    steps:
    - name: Checkout the Git repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      with:
        persist-credentials: false
    - name: Set up Ruby and locked gems
      uses: ruby/setup-ruby@26e5b7d197ebf60545ee9667bcbace0be11ccaec # v1
      with:
        ruby-version: '3.3'
        bundler-cache: true
    - name: Run release infrastructure tests
      run: bundle exec rake -f fastlane/Rakefile test
    - name: Verify ORAS checksums against upstream release manifests
      run: bundle exec ruby Scripts/verify-oras-checksums.rb
