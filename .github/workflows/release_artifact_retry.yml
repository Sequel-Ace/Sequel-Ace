name: Retry Existing Release Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Exact failed production tag to recover without rebuilding
        required: true
        type: string
      expected_commit:
        description: Exact existing release commit
        required: true
        type: string
      expected_manifest_sha256:
        description: SHA-256 of the inspected failed manifest
        required: true
        type: string
      cloud_run_id:
        description: Exact successful existing Production Cloud run
        required: true
        type: string
      confirmation:
        description: Type RETRY ARTIFACTS followed by the exact tag
        required: true
        type: string

permissions: {}
concurrency:
  group: sequel-ace-release
  cancel-in-progress: false

jobs:
  retry:
    if: >-
      (github.actor == 'Jason-Morcos' || github.actor == 'Kaspik') &&
      (github.triggering_actor == 'Jason-Morcos' || github.triggering_actor == 'Kaspik')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: sequel-ace-release
    permissions:
      contents: read
      packages: write
    steps:
      - name: Authorize exact same-build recovery
        env:
          ENABLED: ${{ vars.SA_RELEASE_AUTOMATION_ENABLED }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          CONFIRMATION: ${{ inputs.confirmation }}
          PENDING_ARTIFACT: ${{ vars.SA_RELEASE_PENDING_ARTIFACT_TAG }}
          PENDING_FINALIZATION: ${{ vars.SA_RELEASE_PENDING_FINALIZATION_TAG }}
        run: |
          set -euo pipefail
          [[ "${ENABLED}" == "true" && "${RELEASE_REF}" == "refs/heads/main" ]] || exit 1
          [[ "${RELEASE_TAG}" =~ ^production/[0-9]+\.[0-9]+\.[0-9]+-[1-9][0-9]*$ ]] || exit 1
          [[ "${CONFIRMATION}" == "RETRY ARTIFACTS ${RELEASE_TAG}" ]] || exit 1
          [[ "${PENDING_ARTIFACT}" == "none" || "${PENDING_ARTIFACT}" == "${RELEASE_TAG}" ]] || exit 1
          [[ "${PENDING_FINALIZATION}" == "none" ]] || exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: ruby/setup-ruby@a0102e0972be65f351c307e2d64b9314a57c8073 # v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
      - uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d # v2.0.1
        with:
          url: https://github.com/oras-project/oras/releases/download/v1.3.3/oras_1.3.3_linux_amd64.tar.gz
          checksum: 9ce999f8d2de03fc03968b29d743077a58783e545e5eaa53917ca177352d0e59
      - name: Validate successful existing run and preserve the failed checkpoint
        env:
          GHCR_REPOSITORY: ${{ vars.SA_GHCR_ARCHIVE }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_USERNAME: ${{ github.actor }}
          SA_GITHUB_TOKEN: ${{ github.token }}
          SA_ASC_KEY_ID: ${{ secrets.SA_ASC_KEY_ID }}
          SA_ASC_ISSUER_ID: ${{ secrets.SA_ASC_ISSUER_ID }}
          SA_ASC_PRIVATE_KEY: ${{ secrets.SA_ASC_PRIVATE_KEY }}
          SA_ASC_PRIVATE_KEY_BASE64: '1'
          SA_ASC_REQUIRE_ISSUER: '1'
          PRODUCTION_WORKFLOW: ${{ vars.SA_PRODUCTION_CLOUD_WORKFLOW_ID }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_COMMIT: ${{ inputs.expected_commit }}
          EXPECTED_DIGEST: ${{ inputs.expected_manifest_sha256 }}
          CLOUD_RUN_ID: ${{ inputs.cloud_run_id }}
        run: |
          set -euo pipefail
          archive_ref="${GHCR_REPOSITORY}:${RELEASE_TAG//\//-}"
          Scripts/archive-release-to-ghcr.sh pull "${archive_ref}" retry-archive >/dev/null
          bundle exec ruby -Ifastlane/lib -rsequel_ace_release <<'RUBY'
          client = SequelAceRelease::AppStoreConnectClient.from_env
          github = SequelAceRelease::GitHubClient.new(token: ENV.fetch('SA_GITHUB_TOKEN'))
          bytes = File.binread('retry-archive/manifest.json')
          result = SequelAceRelease::ArtifactRetry.new(github: github, client: client).prepare(
            manifest_bytes: bytes, expected_digest: ENV.fetch('EXPECTED_DIGEST'),
            tag: ENV.fetch('RELEASE_TAG'), commit: ENV.fetch('EXPECTED_COMMIT'),
            run_id: ENV.fetch('CLOUD_RUN_ID'), workflow_id: ENV.fetch('PRODUCTION_WORKFLOW'),
            notes: File.read('retry-archive/app-store-notes.txt'), actor: ENV.fetch('GITHUB_ACTOR'),
            workflow_url: "https://github.com/#{ENV.fetch('GITHUB_REPOSITORY')}/actions/runs/#{ENV.fetch('GITHUB_RUN_ID')}"
          )
          File.binwrite("retry-archive/manifest-before-artifact-retry-#{ENV.fetch('EXPECTED_DIGEST')}.json", bytes)
          result.write('retry-archive/manifest.json')
          RUBY
          Scripts/archive-release-to-ghcr.sh push "${archive_ref}" retry-archive >/dev/null
      - name: Arm existing release publication
        env:
          GITHUB_REPOSITORY_ID: ${{ github.repository_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SA_RELEASE_GITHUB_APP_CLIENT_ID: ${{ vars.SA_RELEASE_GITHUB_APP_CLIENT_ID }}
          SA_RELEASE_GITHUB_APP_PRIVATE_KEY: ${{ secrets.SA_RELEASE_GITHUB_APP_PRIVATE_KEY }}
        run: Scripts/release-artifact-wake-state.sh arm "${RELEASE_TAG}"
